<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:"Times New Roman", serif;
}

/* container */
.invitation{
    position:relative;
    width:min(90vw, 500px);
    height:min(65vw, 360px);
    perspective:1200px;
}

/* panels */
.panel{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    background:#91AC97;
    border:2px solid #C4AE40;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    transition:transform 1.4s ease-in-out;
}

.left{
    left:0;
    transform-origin:left center;
    border-right:none;
    z-index:1;
}

.right{
    right:0;
    transform-origin:right center;
    border-left:none;
    z-index:1;
}

/* seal (fixed on top, NOT hidden by doors) */
.seal{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:110px;
    height:110px;
    border-radius:50%;
    background:white;
    color:#C4AE40;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:bold;
    font-size:14px;
    line-height:1.3;
    border:3px solid #C4AE40;
    box-shadow:0 6px 15px rgba(0,0,0,.2);
    cursor:pointer;
    z-index:10;
}

/* open animation */
.open .left{
    transform:rotateY(-120deg);
}

.open .right{
    transform:rotateY(120deg);
}

</style>
</head>

<body>

<div class="invitation" id="invite">

    <div class="panel left"></div>
    <div class="panel right"></div>

    <div class="seal" id="seal">
        TAP<br>TO OPEN
    </div>

</div>

<script>
const invite = document.getElementById("invite");
const seal = document.getElementById("seal");

seal.addEventListener("click", () => {

    invite.classList.add("open");

    setTimeout(() => {
        window.location.href = "https://sites.google.com/view/luqmaanzahrah/home";
    }, 1500);

});
</script>

</body>
</html>
